<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Generator Resi Pro - Skala Maksimal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        
        body { 
            font-family: 'Inter', sans-serif; 
            touch-action: manipulation;
            @apply bg-slate-50;
        }
        
        .preview-wrapper {
            width: 100%;
            height: calc(100vh - 150px);
            min-height: 500px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #cbd5e1;
            border-radius: 1.5rem;
            padding: 1.5rem;
            overflow: hidden;
            position: relative;
            border: 1px dashed #94a3b8;
        }

        #scaling-container {
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-origin: center center;
            display: flex;
            justify-content: center;
            align-items: center;
            will-change: transform;
        }

        .paper-border {
            background: white;
            box-shadow: 0 20px 40px -10px rgba(0,0,0,0.2);
            position: relative;
            padding: 12px; 
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            height: auto;
            min-height: fit-content;
        }

        /* Ukuran Dasar Kertas A6 */
        .p-a6 { width: 320px; min-height: 450px; font-size: 13px; } 
        .l-a6 { width: 450px; min-height: 320px; font-size: 13px; }

        .preview-card {
            background: white;
            border: 1px solid #000;
            display: flex;
            flex-direction: column;
            height: auto;
            width: 100%;
            box-sizing: border-box;
            overflow: visible;
        }

        #prevRecName { font-size: 1.6em; line-height: 1.1; margin-bottom: 3px; font-weight: 900; }
        #prevRecPhone { font-size: 1.15em; font-weight: 900; margin-bottom: 3px; }
        #prevRecAddress { font-size: 1.05em; line-height: 1.2; font-weight: 800; }
        .item-text { font-size: 0.95em; line-height: 1.3; }

        .active-btn {
            background-color: #2563eb !important;
            color: white !important;
            border-color: #1e40af !important;
            box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.4);
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">
    <div class="max-w-7xl mx-auto p-4 md:p-8">
        <header class="mb-10">
            <h1 class="text-4xl font-black text-slate-800 tracking-tighter italic">RESI <span class="text-blue-600">PRECISE</span></h1>
            <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mt-1">Sistem Label Pengiriman A6 Pro</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            <!-- Panel Input -->
            <div class="lg:col-span-5 space-y-6">
                <div class="bg-white p-6 rounded-[2rem] shadow-xl border border-slate-200">
                    <div class="mb-8">
                        <label class="text-[10px] font-black text-slate-400 uppercase block mb-2 text-center">Orientasi Resi A6</label>
                        <div class="flex bg-slate-100 p-1 rounded-xl max-w-[200px] mx-auto">
                            <button onclick="setOrientation('p')" id="btn-p" class="ori-btn flex-1 py-2 rounded-lg text-xs font-black active-btn">POTRET</button>
                            <button onclick="setOrientation('l')" id="btn-l" class="ori-btn flex-1 py-2 rounded-lg text-xs font-black">LANSKAP</button>
                        </div>
                    </div>

                    <div class="space-y-6">
                        <div class="space-y-3">
                            <h3 class="text-xs font-black text-blue-600 uppercase">Data Penerima</h3>
                            <input type="text" id="receiverName" placeholder="Nama Lengkap" class="w-full p-4 bg-slate-50 border-none rounded-2xl text-sm focus:ring-2 focus:ring-blue-500 shadow-inner">
                            <input type="tel" id="receiverPhone" placeholder="Nomor HP" class="w-full p-4 bg-slate-50 border-none rounded-2xl text-sm focus:ring-2 focus:ring-blue-500 shadow-inner">
                            <textarea id="receiverAddress" rows="2" placeholder="Alamat Pengiriman Lengkap..." class="w-full p-4 bg-slate-50 border-none rounded-2xl text-sm focus:ring-2 focus:ring-blue-500 shadow-inner"></textarea>
                        </div>

                        <div class="pt-6 border-t border-slate-100 space-y-3">
                            <div class="flex justify-between items-center">
                                <h3 class="text-xs font-black text-slate-400 uppercase">Data Pengirim</h3>
                                <div class="flex gap-1">
                                    <button onclick="quickFill(1)" class="bg-slate-800 text-white text-[9px] px-2 py-1 rounded shadow-sm">MUFLIH</button>
                                    <button onclick="quickFill(2)" class="bg-slate-800 text-white text-[9px] px-2 py-1 rounded shadow-sm">VI PRINT</button>
                                </div>
                            </div>
                            <input type="text" id="senderName" placeholder="Nama Toko/Pengirim" class="w-full p-4 bg-slate-50 border-none rounded-2xl text-sm focus:ring-2 focus:ring-blue-500 shadow-inner">
                            <input type="tel" id="senderPhone" placeholder="WhatsApp Pengirim" class="w-full p-4 bg-slate-50 border-none rounded-2xl text-sm focus:ring-2 focus:ring-blue-500 shadow-inner">
                        </div>

                        <div class="pt-6 border-t border-slate-100">
                            <div class="flex justify-between items-center mb-4">
                                <h3 class="text-xs font-black text-slate-400 uppercase">Daftar Barang</h3>
                                <button onclick="addItem()" class="text-blue-600 font-black text-[10px]">+ TAMBAH ITEM</button>
                            </div>
                            <div id="itemListContainer" class="space-y-2 max-h-40 overflow-y-auto pr-2"></div>
                        </div>
                    </div>

                    <button id="btnShare" onclick="generateAndSharePDF()" class="w-full mt-8 bg-blue-600 hover:bg-blue-700 text-white font-black py-5 rounded-[1.5rem] shadow-lg shadow-blue-200 transition-all flex items-center justify-center gap-3 active:scale-95">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z" />
                        </svg>
                        BAGIKAN PDF
                    </button>
                </div>
            </div>

            <!-- Area Preview -->
            <div class="lg:col-span-7">
                <div class="lg:sticky lg:top-8">
                    <div id="preview-window" class="preview-wrapper">
                        <div id="scaling-container">
                            <div id="paper" class="paper-border p-a6">
                                <div id="resiPreview" class="preview-card">
                                    <div class="content-wrapper p-4">
                                        <div class="mb-3 shrink-0">
                                            <div class="text-[0.55em] font-black text-black mb-0.5 uppercase">PENERIMA:</div>
                                            <div id="prevRecName" class="font-black uppercase"></div>
                                            <div id="prevRecPhone" class="mb-0.5"></div>
                                            <div id="prevRecAddress" class="border-l-2 border-black pl-3 uppercase"></div>
                                        </div>

                                        <div class="pt-2 border-t border-dashed border-black shrink-0">
                                            <div class="text-[0.5em] font-black text-black uppercase">PENGIRIM:</div>
                                            <div class="flex flex-wrap items-baseline gap-x-2">
                                                <div id="prevSendName" class="font-bold text-black uppercase"></div>
                                                <div id="prevSendPhone" class="text-[0.8em] text-black"></div>
                                            </div>
                                        </div>

                                        <div id="prevTableArea" class="mt-4 border-t border-black pt-2 flex flex-col">
                                            <div class="text-[0.6em] font-black mb-1.5 uppercase tracking-tight text-black">Isi Paket:</div>
                                            <div class="scrollable-items">
                                                <table class="w-full border-separate border-spacing-y-1">
                                                    <tbody id="prevItemsTable"></tbody>
                                                </table>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="mt-auto border-t border-black px-3 py-2 flex justify-between items-center bg-white shrink-0">
                                        <div class="text-[0.55em] font-black text-black uppercase" id="prevSizeLabel">A6 Potret</div>
                                        <div id="currentDate" class="text-[0.55em] font-bold text-black"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const { jsPDF } = window.jspdf;
        // Hanya A6 yang tersedia sekarang
        let config = { size: 'a6', ori: 'p' };
        let items = [{ name: '', qty: '' }];
        
        const fontScales = { 'a6': 1.0 };

        const quickData = {
            1: { name: "MUFLIH STORE", contact: "081574009621" },
            2: { name: "VI PRINT CENTER", contact: "085823253354" }
        };

        function quickFill(type) {
            const data = quickData[type];
            document.getElementById('senderName').value = data.name;
            document.getElementById('senderPhone').value = data.contact;
            updatePreview();
        }

        function setOrientation(o) {
            config.ori = o;
            updateUI();
        }

        function updateUI() {
            document.querySelectorAll('.ori-btn').forEach(b => b.classList.remove('active-btn'));
            document.getElementById(`btn-${config.ori}`).classList.add('active-btn');

            const paper = document.getElementById('paper');
            paper.className = `paper-border ${config.ori}-a6`;
            
            const oriLabel = config.ori === 'p' ? 'Potret' : 'Lanskap';
            document.getElementById('prevSizeLabel').innerText = `A6 ${oriLabel}`;
            
            setTimeout(adjustScale, 10);
            updatePreview();
        }

        function adjustScale() {
            const container = document.getElementById('preview-window');
            const paper = document.getElementById('paper');
            const scalingGroup = document.getElementById('scaling-container');
            
            const safePadding = 40;
            const contWidth = container.offsetWidth - safePadding;
            const contHeight = container.offsetHeight - safePadding;
            
            const paperWidth = paper.offsetWidth;
            const paperHeight = paper.offsetHeight;

            const scaleX = contWidth / paperWidth;
            const scaleY = contHeight / paperHeight;
            
            const finalScale = Math.min(scaleX, scaleY);
            scalingGroup.style.transform = `scale(${finalScale})`;
        }

        window.addEventListener('resize', adjustScale);

        function addItem() {
            items.push({ name: '', qty: '' });
            renderItemInputs();
            updatePreview();
        }

        function removeItem(index) {
            items.splice(index, 1);
            renderItemInputs();
            updatePreview();
        }

        function updateItem(index, field, value) {
            items[index][field] = value;
            updatePreview();
        }

        function renderItemInputs() {
            const container = document.getElementById('itemListContainer');
            container.innerHTML = '';
            items.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'flex gap-2 items-center';
                div.innerHTML = `
                    <input type="text" value="${item.name}" oninput="updateItem(${index}, 'name', this.value)" placeholder="Barang" class="flex-1 p-2 bg-slate-50 rounded-lg text-xs outline-none">
                    <input type="text" value="${item.qty}" oninput="updateItem(${index}, 'qty', this.value)" placeholder="Q" class="w-8 p-2 bg-slate-50 rounded-lg text-xs text-center font-bold outline-none">
                    <button onclick="removeItem(${index})" class="text-slate-300 hover:text-red-500 text-lg">&times;</button>
                `;
                container.appendChild(div);
            });
        }

        const basicInputs = ['senderName', 'senderPhone', 'receiverName', 'receiverPhone', 'receiverAddress'];
        basicInputs.forEach(id => document.getElementById(id).addEventListener('input', updatePreview));

        function updatePreview() {
            document.getElementById('prevRecName').innerText = document.getElementById('receiverName').value;
            document.getElementById('prevRecPhone').innerText = document.getElementById('receiverPhone').value;
            document.getElementById('prevRecAddress').innerText = document.getElementById('receiverAddress').value;
            document.getElementById('prevSendName').innerText = document.getElementById('senderName').value;
            const sPhone = document.getElementById('senderPhone').value;
            document.getElementById('prevSendPhone').innerText = sPhone ? `| ${sPhone}` : '';
            document.getElementById('currentDate').innerText = new Date().toLocaleDateString('id-ID');

            const tableBody = document.getElementById('prevItemsTable');
            tableBody.innerHTML = '';
            const validItems = items.filter(i => i.name.trim() !== "");
            
            validItems.forEach(item => {
                const tr = document.createElement('tr');
                tr.innerHTML = `<td class="py-0.5 item-text text-black uppercase font-medium">${item.name}</td><td class="text-right py-0.5 font-black item-text text-black">${item.qty}</td>`;
                tableBody.appendChild(tr);
            });
            
            setTimeout(adjustScale, 10);
        }

        async function generateAndSharePDF() {
            const a6Size = [105, 148.5];
            let [pdfW, pdfH] = a6Size;
            if(config.ori === 'l') [pdfW, pdfH] = [pdfH, pdfW];

            const doc = new jsPDF({ orientation: config.ori, unit: 'mm', format: 'a6' });
            const margin = 5; 
            const iw = pdfW - (margin * 2);
            const scale = 1.0; // Skala font tetap untuk A6

            const data = {
                sender: document.getElementById('senderName').value.trim() || 'Label',
                senderPhone: document.getElementById('senderPhone').value.trim(),
                receiver: document.getElementById('receiverName').value.trim() || 'Label',
                receiverPhone: document.getElementById('receiverPhone').value.trim(),
                address: document.getElementById('receiverAddress').value.trim()
            };

            let currentY = margin + (8 * scale);

            doc.setFont("helvetica", "bold");
            doc.setFontSize(6 * scale);
            doc.text("PENERIMA:", margin + (4 * scale), currentY);
            currentY += (5 * scale);

            if (data.receiver) {
                doc.setFontSize(15 * scale);
                const splitName = doc.splitTextToSize(data.receiver.toUpperCase(), iw - (8 * scale));
                doc.text(splitName, margin + (4 * scale), currentY);
                currentY += (splitName.length * (7 * scale));
            }
            if (data.receiverPhone) {
                doc.setFontSize(11 * scale);
                doc.text(data.receiverPhone, margin + (4 * scale), currentY);
                currentY += (6 * scale);
            }
            if (data.address) {
                doc.setFontSize(10 * scale);
                const splitAddr = doc.splitTextToSize(data.address.toUpperCase(), iw - (12 * scale));
                doc.setLineWidth(0.5 * scale); 
                doc.line(margin + (4 * scale), currentY - (3 * scale), margin + (4 * scale), currentY + (splitAddr.length * 4.5 * scale) - (3 * scale));
                doc.text(splitAddr, margin + (6 * scale), currentY);
                currentY += (splitAddr.length * (4.5 * scale)) + (2 * scale);
            }

            currentY += (2 * scale);
            doc.setLineWidth(0.15 * scale); 
            doc.setLineDashPattern([2, 1], 0);
            doc.line(margin + (4 * scale), currentY, pdfW - margin - (4 * scale), currentY);
            doc.setLineDashPattern([], 0);
            currentY += (6 * scale);

            doc.setFontSize(6 * scale);
            doc.text("PENGIRIM:", margin + (4 * scale), currentY);
            currentY += (4 * scale);

            doc.setFontSize(8.5 * scale);
            doc.text(`${data.sender.toUpperCase()} ${data.senderPhone ? '| '+data.senderPhone : ''}`, margin + (4 * scale), currentY);
            currentY += (6 * scale);

            const validItems = items.filter(i => i.name.trim() !== "");
            if (validItems.length > 0) {
                currentY += (2 * scale);
                doc.setLineWidth(0.15 * scale); 
                doc.line(margin + (4 * scale), currentY, pdfW - margin - (4 * scale), currentY);
                currentY += (6 * scale);
                
                doc.setFontSize(6.5 * scale);
                doc.text("ISI PAKET:", margin + (4 * scale), currentY);
                currentY += (5 * scale);
                
                validItems.forEach(item => {
                    doc.setFontSize(9 * scale);
                    doc.setFont("helvetica", "normal");
                    doc.text(item.name.toUpperCase(), margin + (4 * scale), currentY);
                    doc.setFont("helvetica", "bold");
                    doc.text(item.qty, pdfW - margin - (6 * scale), currentY, { align: 'right' });
                    currentY += (5.5 * scale);
                });
            }

            const footerY = pdfH - margin - (3 * scale);
            doc.setFontSize(5 * scale);
            doc.text(`RESI PRECISE A6 - ${new Date().toLocaleDateString('id-ID')}`, margin + (4 * scale), footerY);

            doc.setLineWidth(0.1); 
            doc.rect(margin, margin, iw, pdfH - (margin * 2));

            const fileName = `Resi_${data.receiver}.pdf`;
            const pdfBlob = doc.output('blob');

            if (navigator.share && navigator.canShare && navigator.canShare({ files: [new File([pdfBlob], fileName, { type: 'application/pdf' })] })) {
                try {
                    const file = new File([pdfBlob], fileName, { type: 'application/pdf' });
                    await navigator.share({
                        files: [file],
                        title: 'Label Pengiriman',
                        text: `Label Resi untuk ${data.receiver}`
                    });
                } catch (err) {
                    if (err.name !== 'AbortError') {
                        doc.save(fileName);
                    }
                }
            } else {
                doc.save(fileName);
                const msg = document.createElement('div');
                msg.className = "fixed bottom-10 left-1/2 -translate-x-1/2 bg-slate-800 text-white px-6 py-3 rounded-full text-xs font-bold shadow-2xl z-50";
                msg.innerText = "Browser tidak mendukung fitur bagikan. File otomatis diunduh.";
                document.body.appendChild(msg);
                setTimeout(() => msg.remove(), 3000);
            }
        }

        renderItemInputs();
        setTimeout(updateUI, 100);
    </script>
</body>
</html>
