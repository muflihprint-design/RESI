<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Generator Resi Pro - Adjusted Layout</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        
        body { 
            font-family: 'Inter', sans-serif; 
            touch-action: manipulation;
            @apply bg-slate-50;
        }
        
        .preview-wrapper {
            width: 100%;
            height: calc(100vh - 150px);
            min-height: 500px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #cbd5e1;
            border-radius: 1.5rem;
            padding: 1.5rem;
            overflow: hidden;
            position: relative;
            border: 1px dashed #94a3b8;
        }

        #scaling-container {
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-origin: center center;
            display: flex;
            justify-content: center;
            align-items: center;
            will-change: transform;
        }

        .paper-standard {
            background: #f1f5f9;
            box-shadow: 0 20px 40px -10px rgba(0,0,0,0.2);
            position: relative;
            padding: 12px; 
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            overflow: hidden;
        }

        /* Ukuran Kertas */
        .p-a6 { width: 320px; height: 450px; } 
        .l-a6 { width: 450px; height: 320px; }
        .p-a5 { width: 450px; height: 635px; }
        .l-a5 { width: 635px; height: 450px; }
        .p-a4 { width: 635px; height: 900px; }
        .l-a4 { width: 900px; height: 635px; }

        .dynamic-border-card {
            background: white;
            border: 1.5px solid #000;
            display: flex;
            flex-direction: column;
            height: auto;
            width: 100%;
            box-sizing: border-box;
            transition: height 0.3s ease;
        }

        /* Ukuran Dasar Font */
        .p-a6, .l-a6 { font-size: 13px; }
        .p-a5, .l-a5 { font-size: 19px; }
        .p-a4, .l-a4 { font-size: 27px; }

        /* Styling Target Font Dinamis */
        #prevRecName { line-height: 1; margin-top: 4px; margin-bottom: 2px; font-weight: 900; }
        #prevRecPhone { font-weight: 900; margin-bottom: 2px; }
        #prevRecAddress { line-height: 1.2; font-weight: 800; }
        
        .item-text { font-size: 0.95em; line-height: 1.3; }

        .active-btn {
            background-color: #2563eb !important;
            color: white !important;
            border-color: #1e40af !important;
            box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.4);
        }

        input[type="range"] {
            @apply h-1.5 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-blue-600;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">
    <div class="max-w-7xl mx-auto p-4 md:p-8">
        <header class="mb-10 flex justify-between items-end">
            <div>
                <h1 class="text-4xl font-black text-slate-800 tracking-tighter italic">RESI <span class="text-blue-600">PRECISE</span></h1>
                <p class="text-[10px] font-bold text-slate-400 uppercase">Solusi Label Pengiriman Profesional</p>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            <!-- Panel Input -->
            <div class="lg:col-span-5 space-y-6">
                <div class="bg-white p-6 rounded-[2rem] shadow-xl border border-slate-200">
                    <div class="grid grid-cols-2 gap-4 mb-8">
                        <div>
                            <label class="text-[10px] font-black text-slate-400 uppercase block mb-2">Ukuran Kertas</label>
                            <div class="flex bg-slate-100 p-1 rounded-xl">
                                <button onclick="setSize('a6')" id="btn-a6" class="size-btn flex-1 py-2 rounded-lg text-xs font-black active-btn">A6</button>
                                <button onclick="setSize('a5')" id="btn-a5" class="size-btn flex-1 py-2 rounded-lg text-xs font-black">A5</button>
                                <button onclick="setSize('a4')" id="btn-a4" class="size-btn flex-1 py-2 rounded-lg text-xs font-black">A4</button>
                            </div>
                        </div>
                        <div>
                            <label class="text-[10px] font-black text-slate-400 uppercase block mb-2">Orientasi</label>
                            <div class="flex bg-slate-100 p-1 rounded-xl">
                                <button onclick="setOrientation('p')" id="btn-p" class="ori-btn flex-1 py-2 rounded-lg text-xs font-black active-btn">P</button>
                                <button onclick="setOrientation('l')" id="btn-l" class="ori-btn flex-1 py-2 rounded-lg text-xs font-black">L</button>
                            </div>
                        </div>
                    </div>

                    <div class="space-y-6">
                        <!-- Data Penerima -->
                        <div class="space-y-3">
                            <div class="flex justify-between items-center">
                                <h3 class="text-xs font-black text-blue-600 uppercase">Data Penerima</h3>
                                <div class="flex items-center gap-2 bg-blue-50 px-3 py-1 rounded-full">
                                    <span class="text-[9px] font-black text-blue-700">UKURAN FONT</span>
                                    <input type="range" id="fontSizeScale" min="0.8" max="2.8" step="0.1" value="0.8" class="w-20" oninput="updatePreview()">
                                </div>
                            </div>
                            <input type="text" id="receiverName" placeholder="Nama Penerima" class="w-full p-4 bg-slate-50 border-none rounded-2xl text-sm focus:ring-2 focus:ring-blue-500 shadow-inner">
                            <input type="tel" id="receiverPhone" placeholder="Nomor HP" class="w-full p-4 bg-slate-50 border-none rounded-2xl text-sm focus:ring-2 focus:ring-blue-500 shadow-inner">
                            <textarea id="receiverAddress" rows="2" placeholder="Alamat Lengkap..." class="w-full p-4 bg-slate-50 border-none rounded-2xl text-sm focus:ring-2 focus:ring-blue-500 shadow-inner"></textarea>
                        </div>

                        <!-- Data Pengirim -->
                        <div class="pt-6 border-t border-slate-100 space-y-3">
                            <div class="flex justify-between items-center">
                                <h3 class="text-xs font-black text-slate-400 uppercase">Data Pengirim</h3>
                                <div class="flex gap-1">
                                    <button onclick="quickFill(1)" class="bg-slate-800 text-white text-[9px] px-2 py-1 rounded shadow-sm hover:bg-black transition-colors">MUFLIH</button>
                                    <button onclick="quickFill(2)" class="bg-slate-800 text-white text-[9px] px-2 py-1 rounded shadow-sm hover:bg-black transition-colors">VI PRINT</button>
                                </div>
                            </div>
                            <input type="text" id="senderName" placeholder="Nama Toko" class="w-full p-4 bg-slate-50 border-none rounded-2xl text-sm focus:ring-2 focus:ring-blue-500 shadow-inner">
                            <input type="tel" id="senderPhone" placeholder="WhatsApp" class="w-full p-4 bg-slate-50 border-none rounded-2xl text-sm focus:ring-2 focus:ring-blue-500 shadow-inner">
                        </div>

                        <!-- Daftar Barang -->
                        <div class="pt-6 border-t border-slate-100">
                            <div class="flex justify-between items-center mb-4">
                                <h3 class="text-xs font-black text-slate-400 uppercase">Daftar Barang</h3>
                                <button onclick="addItem()" class="text-blue-600 font-black text-[10px]">+ TAMBAH ITEM</button>
                            </div>
                            <div id="itemListContainer" class="space-y-2 max-h-40 overflow-y-auto pr-2"></div>
                        </div>
                    </div>

                    <div class="flex gap-4 mt-8">
                        <button onclick="generateAndSharePDF('print')" 
                            class="group flex items-center justify-center gap-2 px-6 py-2.5 min-w-[120px] 
                                   bg-white/80 backdrop-blur-sm border border-slate-200 text-slate-600 
                                   rounded-xl font-semibold text-sm tracking-wide
                                   transition-all duration-300 ease-out
                                   hover:bg-white hover:border-slate-400 hover:text-slate-900 hover:shadow-md
                                   active:scale-95">
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 transition-transform group-hover:-translate-y-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z" />
                            </svg>
                            CETAK
                        </button>

                        <button onclick="generateAndSharePDF('share')" 
                            class="group flex items-center justify-center gap-2 px-6 py-2.5 min-w-[120px] 
                                   bg-gradient-to-br from-blue-600 to-indigo-700 text-white 
                                   rounded-xl font-semibold text-sm tracking-wide shadow-lg shadow-blue-200/50
                                   transition-all duration-300 ease-out
                                   hover:from-blue-700 hover:to-indigo-800 hover:shadow-blue-300/60 hover:-translate-y-0.5
                                   active:scale-95">
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 transition-transform group-hover:rotate-12" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z" />
                            </svg>
                            BAGIKAN
                        </button>
                    </div>
                </div>
            </div>

            <!-- Area Preview -->
            <div class="lg:col-span-7">
                <div class="lg:sticky lg:top-8">
                    <div id="preview-window" class="preview-wrapper">
                        <div id="scaling-container">
                            <div id="paper" class="paper-standard p-a6">
                                <div id="resiPreview" class="dynamic-border-card">
                                    <div class="p-4 flex flex-col h-full">
                                        <!-- Header Penerima Berbasis Flow -->
                                        <div class="mb-4">
                                            <div class="text-[0.55em] font-black text-black uppercase opacity-40">PENERIMA:</div>
                                            <div id="prevRecName" class="font-black uppercase"></div>
                                            <div id="prevRecPhone"></div>
                                            <div id="prevRecAddress" class="border-l-[3px] border-black pl-3 mt-1 uppercase"></div>
                                        </div>

                                        <!-- Pengirim -->
                                        <div class="pt-2 border-t border-dashed border-black">
                                            <div class="text-[0.5em] font-black text-black uppercase opacity-40">PENGIRIM:</div>
                                            <div class="flex flex-wrap items-baseline gap-x-2">
                                                <div id="prevSendName" class="font-bold text-black uppercase"></div>
                                                <div id="prevSendPhone" class="text-[0.8em] text-black"></div>
                                            </div>
                                        </div>

                                        <!-- Isi Paket -->
                                        <div id="prevTableArea" class="mt-4 border-t border-black pt-2">
                                            <div class="text-[0.6em] font-black mb-1.5 uppercase tracking-tight text-black opacity-40">Isi Paket:</div>
                                            <table class="w-full border-separate border-spacing-y-1">
                                                <tbody id="prevItemsTable"></tbody>
                                            </table>
                                        </div>

                                        <!-- Footer Label -->
                                        <div class="mt-auto border-t border-black pt-2 flex justify-between items-center bg-white pb-1">
                                            <div class="text-[0.55em] font-black text-black uppercase" id="prevSizeLabel">A6 Potret</div>
                                            <div id="currentDate" class="text-[0.55em] font-bold text-black"></div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const { jsPDF } = window.jspdf;
        let config = { size: 'a6', ori: 'p' };
        let items = [{ name: '', qty: '' }];
        
        const fontScales = { 'a6': 1.0, 'a5': 1.6, 'a4': 2.5 };
        const quickData = {
            1: { name: "MUFLIH PRINT", contact: "081574009621" },
            2: { name: "VI PRINTING", contact: "085657175873" }
        };

        function quickFill(type) {
            const data = quickData[type];
            document.getElementById('senderName').value = data.name;
            document.getElementById('senderPhone').value = data.contact;
            updatePreview();
        }

        function setSize(s) {
            config.size = s;
            updateUI();
        }

        function setOrientation(o) {
            config.ori = o;
            updateUI();
        }

        function updateUI() {
            document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active-btn'));
            document.querySelectorAll('.ori-btn').forEach(b => b.classList.remove('active-btn'));
            document.getElementById(`btn-${config.size}`).classList.add('active-btn');
            document.getElementById(`btn-${config.ori}`).classList.add('active-btn');

            const paper = document.getElementById('paper');
            paper.className = `paper-standard ${config.ori}-${config.size}`;
            
            const oriLabel = config.ori === 'p' ? 'Potret' : 'Lanskap';
            document.getElementById('prevSizeLabel').innerText = `${config.size.toUpperCase()} ${oriLabel}`;
            
            setTimeout(adjustScale, 50);
            updatePreview();
        }

        function adjustScale() {
            const container = document.getElementById('preview-window');
            const paper = document.getElementById('paper');
            const scalingGroup = document.getElementById('scaling-container');
            
            const safePadding = 40;
            const contWidth = container.offsetWidth - safePadding;
            const contHeight = container.offsetHeight - safePadding;
            
            const paperWidth = paper.offsetWidth;
            const paperHeight = paper.offsetHeight;

            const scaleX = contWidth / paperWidth;
            const scaleY = contHeight / paperHeight;
            
            const finalScale = Math.min(scaleX, scaleY);
            scalingGroup.style.transform = `scale(${finalScale})`;
        }

        window.addEventListener('resize', adjustScale);

        function addItem() {
            items.push({ name: '', qty: '' });
            renderItemInputs();
            updatePreview();
        }

        function removeItem(index) {
            items.splice(index, 1);
            renderItemInputs();
            updatePreview();
        }

        function updateItem(index, field, value) {
            items[index][field] = value;
            updatePreview();
        }

       function renderItemInputs() {
    const container = document.getElementById('itemListContainer');
    container.innerHTML = '';
    
    items.forEach((item, index) => {
        const div = document.createElement('div');
        // Tambahkan 'p-1' agar ada ruang untuk bayangan focus (ring) muncul
        div.className = 'flex gap-2 items-center w-full mb-1 p-0.5'; 
        
        div.innerHTML = `
            <input type="text" 
                   value="${item.name}" 
                   oninput="updateItem(${index}, 'name', this.value)" 
                   placeholder="Nama Barang" 
                   /* PENTING: 
                      - focus:ring-inset agar warna biru masuk ke dalam (tidak terpotong)
                      - focus:ring-2 untuk mempertegas warna biru
                   */
                   class="flex-1 min-w-0 p-2 bg-slate-50 rounded-lg text-xs outline-none focus:ring-2 focus:ring-inset focus:ring-blue-500 transition-all">
            
            <input type="text" 
                   value="${item.qty}" 
                   oninput="updateItem(${index}, 'qty', this.value)" 
                   placeholder="Qty" 
                   class="w-20 p-2 bg-slate-50 rounded-lg text-xs text-center font-bold outline-none focus:ring-2 focus:ring-inset focus:ring-blue-500 transition-all">
            
            <button onclick="removeItem(${index})" 
                    class="text-slate-300 hover:text-red-500 text-xl pr-1">&times;</button>
        `;
        container.appendChild(div);
    });
}
        
        const basicInputs = ['senderName', 'senderPhone', 'receiverName', 'receiverPhone', 'receiverAddress', 'fontSizeScale'];
        basicInputs.forEach(id => document.getElementById(id).addEventListener('input', updatePreview));

        function updatePreview() {
            const userScale = parseFloat(document.getElementById('fontSizeScale').value);
            
            // Apply scale directly to fonts
            const recName = document.getElementById('prevRecName');
            const recPhone = document.getElementById('prevRecPhone');
            const recAddr = document.getElementById('prevRecAddress');

            recName.style.fontSize = `${userScale * 1.8}em`;
            recPhone.style.fontSize = `${userScale * 1.1}em`;
            recAddr.style.fontSize = `${userScale * 0.9}em`;

            recName.innerText = document.getElementById('receiverName').value || 'NAMA PENERIMA';
            recPhone.innerText = document.getElementById('receiverPhone').value;
            recAddr.innerText = document.getElementById('receiverAddress').value;
            
            document.getElementById('prevSendName').innerText = document.getElementById('senderName').value || 'NAMA TOKO';
            const sPhone = document.getElementById('senderPhone').value;
            document.getElementById('prevSendPhone').innerText = sPhone ? `| ${sPhone}` : '';
            document.getElementById('currentDate').innerText = new Date().toLocaleDateString('id-ID');

            const tableBody = document.getElementById('prevItemsTable');
            tableBody.innerHTML = '';
            const validItems = items.filter(i => i.name.trim() !== "");
            
            validItems.forEach(item => {
                const tr = document.createElement('tr');
                tr.innerHTML = `<td class="py-0.5 item-text text-black uppercase font-medium">${item.name}</td><td class="text-right py-0.5 font-black item-text text-black">${item.qty}</td>`;
                tableBody.appendChild(tr);
            });
        }

        async function generateAndSharePDF(mode = 'share') {
            const formats = { 'a6': [105, 148.5], 'a5': [148.5, 210], 'a4': [210, 297] };
            let [pdfW, pdfH] = formats[config.size];
            if(config.ori === 'l') [pdfW, pdfH] = [pdfH, pdfW];

            const doc = new jsPDF({ orientation: config.ori, unit: 'mm', format: config.size });
            const margin = 5; 
            const iw = pdfW - (margin * 2);
            const baseScale = fontScales[config.size];
            const userScale = parseFloat(document.getElementById('fontSizeScale').value);

            const data = {
                sender: document.getElementById('senderName').value.trim() || 'Label',
                senderPhone: document.getElementById('senderPhone').value.trim(),
                receiver: document.getElementById('receiverName').value.trim() || 'Penerima',
                receiverPhone: document.getElementById('receiverPhone').value.trim(),
                address: document.getElementById('receiverAddress').value.trim()
            };

            let currentY = margin + (5 * baseScale);

            // Label "PENERIMA"
            doc.setFont("helvetica", "bold");
            doc.setFontSize(6 * baseScale);
            doc.setTextColor(150, 150, 150);
            doc.text("PENERIMA:", margin + (4 * baseScale), currentY);
            doc.setTextColor(0, 0, 0);
            currentY += (2 * baseScale); // Gap kecil ke nama agar tidak menimpa

            // Nama Penerima
            if (data.receiver) {
                const fontSize = 18 * userScale * baseScale;
                doc.setFontSize(fontSize);
                const splitName = doc.splitTextToSize(data.receiver.toUpperCase(), iw - (8 * baseScale));
                // Hitung posisi Y agar teks nama tidak memotong label "PENERIMA"
                currentY += (fontSize * 0.25); 
                doc.text(splitName, margin + (4 * baseScale), currentY);
                currentY += (splitName.length * (fontSize * 0.35));
            }

            // Phone
            if (data.receiverPhone) {
                const fontSize = 13 * userScale * baseScale;
                doc.setFontSize(fontSize);
                doc.text(data.receiverPhone, margin + (4 * baseScale), currentY);
                currentY += (fontSize * 0.38);
            }

            // Alamat
            if (data.address) {
                const fontSize = 11 * userScale * baseScale;
                doc.setFontSize(fontSize);
                const splitAddr = doc.splitTextToSize(data.address.toUpperCase(), iw - (12 * baseScale));
                
                // Border garis samping alamat
                doc.setLineWidth(0.6 * baseScale); 
                const lineStart = currentY - (fontSize * 0.3);
                const lineEnd = currentY + (splitAddr.length * fontSize * 0.38) - (fontSize * 0.3);
                doc.line(margin + (4 * baseScale), lineStart, margin + (4 * baseScale), lineEnd);
                
                doc.text(splitAddr, margin + (6 * baseScale), currentY);
                currentY += (splitAddr.length * (fontSize * 0.25)) + (2 * baseScale);
            }

            // Divider Dashed
            doc.setLineWidth(0.15 * baseScale); 
            doc.setLineDashPattern([2, 1], 0);
            doc.line(margin + (4 * baseScale), currentY, pdfW - margin - (4 * baseScale), currentY);
            doc.setLineDashPattern([], 0);
            currentY += (4 * baseScale);

            // Pengirim
            doc.setFontSize(6 * baseScale);
            doc.setTextColor(150, 150, 150);
            doc.text("PENGIRIM:", margin + (4 * baseScale), currentY);
            doc.setTextColor(0, 0, 0);
            currentY += (4 * baseScale);

            doc.setFontSize(8.5 * baseScale);
            doc.text(`${data.sender.toUpperCase()} ${data.senderPhone ? '| '+data.senderPhone : ''}`, margin + (4 * baseScale), currentY);
            currentY += (4 * baseScale);

            // Daftar Barang
            const validItems = items.filter(i => i.name.trim() !== "");
            if (validItems.length > 0) {
    // 1. Garis Atas (Pembatas Label Isi Paket)
    doc.setLineWidth(0.15 * baseScale); 
    doc.line(margin + (4 * baseScale), currentY, pdfW - margin - (4 * baseScale), currentY);
    
    // JARAK DIRAPATKAN: Dari 4 ke 2.5 agar teks "ISI PAKET" dekat ke garis
    currentY += (3.5 * baseScale); 
    
    doc.setFontSize(6.5 * baseScale);
    doc.setTextColor(150, 150, 150);
    doc.text("ISI PAKET:", margin + (4 * baseScale), currentY);
    doc.setTextColor(0, 0, 0);

    // JARAK DIRAPATKAN: Dari 4 ke 3 agar item pertama dekat dengan judul "ISI PAKET"
    currentY += (5 * baseScale); 
    
    validItems.forEach(item => {
        doc.setFontSize(9 * baseScale);
        doc.setFont("helvetica", "normal");
        
        // Tulis Nama Barang
        doc.text(item.name.toUpperCase(), margin + (4 * baseScale), currentY);
        
        // Tulis Qty
        doc.setFont("helvetica", "bold");
        doc.text(item.qty, pdfW - margin - (6 * baseScale), currentY, { align: 'right' });
        
        // JARAK ANTAR BARIS BARANG: Dari 4 ke 3.5 (Sangat rapat tapi tidak bertumpuk)
        currentY += (4.5 * baseScale); 
    });
}

// Footer
// JARAK DIRAPATKAN: Menghilangkan penambahan currentY yang tidak perlu sebelum garis footer
doc.setLineWidth(0.15 * baseScale); 
doc.line(margin + (4 * baseScale), currentY, pdfW - margin - (4 * baseScale), currentY);

// JARAK KE TEKS FOOTER: Dari 3 ke 2.2
currentY += (2.2 * baseScale); 
doc.setFontSize(5 * baseScale);
doc.setTextColor(120, 120, 120); // Sedikit abu-abu agar footer tidak mencolok
doc.text(`RESI PRECISE - ${config.size.toUpperCase()} - ${new Date().toLocaleDateString('id-ID')}`, margin + (4 * baseScale), currentY);

            // Border Luar (Dynamic Height)
            const boxHeight = currentY + (3 * baseScale) - margin;
            doc.setLineWidth(0.3 * baseScale); 
            doc.rect(margin, margin, iw, boxHeight);

            const fileName = `Resi_${data.receiver}.pdf`;

            if (mode === 'print') {
                doc.autoPrint();
                window.open(doc.output('bloburl'), '_blank');
                return;
            }

            const pdfBlob = doc.output('blob');
            const file = new File([pdfBlob], fileName, { type: 'application/pdf' });
            if (navigator.share) {
                try {
                    await navigator.share({ files: [file], title: 'Resi', text: 'Label Resi' });
                } catch (e) { doc.save(fileName); }
            } else { doc.save(fileName); }
        }

        renderItemInputs();
